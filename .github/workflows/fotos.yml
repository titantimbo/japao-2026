name: baixar-fotos
on:
  push:
    branches: [imagens]
    paths: [tools/**, .github/workflows/fotos.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fetch.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add fotos
          git commit -m "Fotos baixadas da Wikipédia" || true
          git push
